<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CMS</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50">
<div id="pinGate" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center"><h1 class="text-2xl font-bold">Admin</h1><input type="password" id="pinInput" placeholder="••••" class="w-full mt-6 px-4 py-3 border-2 rounded-xl text-center text-xl tracking-widest"><p id="pinError" class="hidden text-red-500 text-sm mt-2">Denied</p><button id="unlockBtn" class="w-full mt-4 py-3 bg-slate-900 text-white rounded-xl">Unlock</button></div></div>
<div id="dashboard" class="hidden"><div class="flex"><div class="w-64 bg-slate-900 text-white min-h-screen p-6 fixed"><h2 class="font-bold text-xl mb-8">BC CMS</h2><button onclick="showTab('contacts')" class="w-full text-left px-4 py-2 rounded bg-blue-600 mb-2">Contacts</button><button onclick="showTab('projects')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 mb-2">Projects</button><button onclick="showTab('experience')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 mb-2">Experience</button><button onclick="showTab('hero')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 mb-2">Hero</button><button onclick="showTab('uploads')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800">Uploads</button><button onclick="logout()" class="mt-10 w-full py-2 bg-slate-800 rounded">Lock</button><a href="../index.html" class="block text-center mt-3 text-xs text-slate-400">Back</a></div>
<div class="ml-64 flex-1 p-8"><div id="tab-contacts"><h1 class="text-3xl font-bold mb-6">Contacts</h1><div id="contactsList" class="bg-white p-4 rounded shadow"></div><button onclick="exportCSV()" class="mt-4 px-4 py-2 bg-green-600 text-white rounded">Export CSV</button></div>
<div id="tab-projects" class="hidden"><h1 class="text-3xl font-bold mb-6">Projects</h1><div id="projectsList" class="space-y-4"></div><button onclick="addProject()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded">Add Project</button><button onclick="saveAll()" class="mt-4 ml-2 px-4 py-2 bg-slate-900 text-white rounded">Save & Download content.json</button></div>
<div id="tab-experience" class="hidden"><h1 class="text-3xl font-bold mb-6">Experience</h1><div id="experienceList"></div><button onclick="saveAll()" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded">Save</button></div>
<div id="tab-hero" class="hidden"><h1 class="text-3xl font-bold mb-6">Hero</h1><div class="bg-white p-6 rounded shadow space-y-4"><input id="heroName" class="w-full border p-3 rounded" placeholder="Name"><input id="heroTitle" class="w-full border p-3 rounded" placeholder="Title"><textarea id="heroDesc" class="w-full border p-3 rounded" rows="3"></textarea><button onclick="saveHero()" class="px-6 py-2 bg-blue-600 text-white rounded">Save</button></div></div>
<div id="tab-uploads" class="hidden"><h1 class="text-3xl font-bold mb-6">Uploads</h1><input type="file" id="fileInput" multiple><div id="uploadedFiles" class="grid grid-cols-3 gap-4 mt-4"></div></div>
</div></div></div>
<script>
const PIN="4347";document.getElementById('unlockBtn').addEventListener('click',()=>{if(document.getElementById('pinInput').value===PIN){document.getElementById('pinGate').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');localStorage.setItem('cms_auth','true');init();}else{document.getElementById('pinError').classList.remove('hidden');}});if(localStorage.getItem('cms_auth')==='true'){document.getElementById('pinGate').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');init();}function logout(){localStorage.removeItem('cms_auth');location.reload();}function showTab(t){document.querySelectorAll('[id^=tab-]').forEach(c=>c.classList.add('hidden'));document.getElementById('tab-'+t).classList.remove('hidden');}
let siteContent=null;async function init(){try{const r=await fetch('../content.json');siteContent=await r.json();}catch(e){siteContent=JSON.parse(localStorage.getItem('siteContent')||'{"hero":{},"projects":[],"experience":[]}');}const local=JSON.parse(localStorage.getItem('siteContent')||'null');if(local)siteContent={...siteContent,...local};renderProjects();loadContacts();loadHero();loadUploads();}
function loadContacts(){const d=JSON.parse(localStorage.getItem('contactSubmissions')||'[]');document.getElementById('contactsList').innerHTML=d.length?`<table class="w-full text-sm"><tr><th>Name</th><th>Email</th><th>Message</th></tr>${d.map(c=>`<tr><td>${c.name}</td><td>${c.email}</td><td>${c.message}</td></tr>`).join('')}</table>`:'No contacts';}
function exportCSV(){const d=JSON.parse(localStorage.getItem('contactSubmissions')||'[]');const csv=['Name,Email,Message',...d.map(c=>`"${c.name}","${c.email}","${c.message}"`)].join('\n');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contacts.csv';a.click();}
function renderProjects(){document.getElementById('projectsList').innerHTML=siteContent.projects.map((p,i)=>`<div class="bg-white p-4 rounded shadow"><input value="${p.title}" onchange="siteContent.projects[${i}].title=this.value;saveLocal()" class="w-full border p-2 rounded mb-2 font-bold"><textarea onchange="siteContent.projects[${i}].description=this.value;saveLocal()" class="w-full border p-2 rounded">${p.description}</textarea><input value="${p.demoUrl}" onchange="siteContent.projects[${i}].demoUrl=this.value;saveLocal()" class="w-full border p-2 rounded mt-2 text-sm" placeholder="Demo URL"><select onchange="siteContent.projects[${i}].status=this.value;saveLocal()" class="mt-2 border p-1 rounded text-sm"><option value="live" ${p.status==='live'?'selected':''}>Live</option><option value="placeholder" ${p.status==='placeholder'?'selected':''}>Placeholder</option></select></div>`).join('');}
function addProject(){siteContent.projects.push({title:"New Project",description:"Desc",demoUrl:"",status:"live"});renderProjects();saveLocal();}
function saveLocal(){localStorage.setItem('siteContent',JSON.stringify(siteContent));}
function saveAll(){saveLocal();const blob=new Blob([JSON.stringify(siteContent,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='content.json';a.click();}
function loadHero(){if(!siteContent.hero)return;document.getElementById('heroName').value=siteContent.hero.name||'';document.getElementById('heroTitle').value=siteContent.hero.title||'';document.getElementById('heroDesc').value=siteContent.hero.description||'';}
function saveHero(){siteContent.hero.name=document.getElementById('heroName').value;siteContent.hero.title=document.getElementById('heroTitle').value;siteContent.hero.description=document.getElementById('heroDesc').value;saveLocal();alert('Saved');}
function loadUploads(){const files=JSON.parse(localStorage.getItem('uploadedFiles')||'[]');document.getElementById('uploadedFiles').innerHTML=files.map(f=>`<div class="bg-white p-3 rounded shadow"><p class="truncate text-sm">${f.name}</p><a href="${f.data}" download="${f.name}" class="text-blue-600 text-xs">Download</a></div>`).join('');}
document.getElementById('fileInput').addEventListener('change',e=>{const files=Array.from(e.target.files);const stored=JSON.parse(localStorage.getItem('uploadedFiles')||'[]');files.forEach(f=>{const r=new FileReader();r.onload=ev=>{stored.push({name:f.name,data:ev.target.result});localStorage.setItem('uploadedFiles',JSON.stringify(stored));loadUploads();};r.readAsDataURL(f);});});
</script>
</body>
</html>
