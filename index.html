<script>
let contentData=null;
async function loadContent(){
  try{const r=await fetch('content.json');contentData=await r.json();const local=JSON.parse(localStorage.getItem('siteContent')||'null');if(local)contentData={...contentData,...local,hero:{...contentData.hero,...(local.hero||{})},about:{...contentData.about,...(local.about||{})}};}catch(e){contentData=JSON.parse(localStorage.getItem('siteContent')||'null')||{"hero": {"name": "Blessed Chisanga", "title": "IT Specialist & Frontend Developer", "description": "Computer Science student at ZCAS University with 7+ years of combined experience in IT support, systems administration, and digital media. Building robust solutions for modern challenges.", "location": "Lusaka, Zambia", "phone": "+260 771935315", "email": "blessedchisanga10@gmail.com"}, "about": {"text1": "I'm a passionate IT Specialist and Frontend Developer currently pursuing Computer Science at ZCAS University. With over 7 years of hands-on experience in IT support, systems administration, and digital media, I bring a unique blend of technical expertise and creative problem-solving to every project.", "text2": "I also manage my own Ubuntu Server infrastructure with SSH for remote photo storage and backup solutions since 2026. My expertise spans from frontend development to network configuration and system administration."}, "skills": [{"name": "Ubuntu Server", "icon": "fa-brands fa-ubuntu", "desc": "Ubuntu Server management, SSH configuration, network setup, and infrastructure maintenance."}, {"name": "Network Administration", "icon": "fa-solid fa-network-wired", "desc": "Network configuration, troubleshooting, and security implementation."}, {"name": "IT Support", "icon": "fa-solid fa-headset", "desc": "Comprehensive IT support and systems administration for multiple clients."}, {"name": "Frontend Development", "icon": "fa-solid fa-code", "desc": "React, TypeScript, Tailwind CSS, modern web development."}], "projects": [{"id": 1, "title": "SIS Portal - Student Information System", "description": "Full-stack SIS portal built with React/TypeScript featuring role-based dashboards, complete CRUD operations, student management, and real-time data updates.", "tags": ["React", "TypeScript", "Full-Stack"], "demoUrl": "https://preview--db5fd247-453c-4bc4-8df3-040ccab9a18a.aippy.live/#sis-page=projects", "githubUrl": "", "status": "live"}, {"id": 2, "title": "Personal Ubuntu Server", "description": "Self-hosted Ubuntu Server infrastructure for remote photo storage and backup. Configured SSH access, automated backups, network security, and file management.", "tags": ["Ubuntu", "SSH"], "demoUrl": "", "githubUrl": "", "status": "placeholder"}], "experience": [{"id": 1, "role": "IT Specialist", "company": "Blessed Solutions Systems Ltd", "duration": "2018 - Present", "details": ["Provided comprehensive IT support and systems administration for multiple clients", "Managed network infrastructure, server maintenance, and hardware troubleshooting", "Implemented security protocols and backup solutions for critical business data"]}], "education": [{"degree": "Bachelor of Science in Computer Science", "school": "ZCAS University", "duration": "2022 - Present", "location": "Lusaka, Zambia"}]};} 
  document.getElementById('heroName').textContent=contentData.hero.name;document.getElementById('heroTitle').textContent=contentData.hero.title;document.getElementById('heroDesc').textContent=contentData.hero.description;document.getElementById('heroLocation').textContent=contentData.hero.location;document.getElementById('heroPhone').textContent=contentData.hero.phone;
  document.getElementById('aboutText1').textContent=contentData.about.text1;document.getElementById('aboutText2').textContent=contentData.about.text2;
  document.getElementById('skillsContainer').innerHTML=contentData.skills.map(s=>`<div class="bg-white p-6 rounded-xl shadow border"><i class="${s.icon}"></i><h3 class="font-semibold mt-2">${s.name}</h3><p class="text-sm text-slate-600 mt-1">${s.desc}</p></div>`).join('');
  document.getElementById('projectsContainer').innerHTML=contentData.projects.map(p=>`<div class="bg-white p-6 rounded-xl shadow border"><h3 class="font-bold text-xl mb-2">${p.title}</h3><p class="text-sm text-slate-600 mb-4">${p.description}</p><div class="flex gap-3">${p.status==='live'&&p.demoUrl?`<a href="${p.demoUrl}" target="_blank" class="px-4 py-2 bg-blue-600 text-white text-sm rounded">Live Demo</a>`:`<span class="px-4 py-2 bg-slate-300 text-slate-500 text-sm rounded">Documentation (Placeholder)</span>`}</div></div>`).join('');
  document.getElementById('experienceContainer').innerHTML=contentData.experience.map(e=>`<div class="bg-white p-6 rounded-xl shadow border"><div class="flex justify-between"><div><h3 class="font-bold text-xl">${e.role}</h3><p class="text-blue-600">${e.company}</p></div><span class="px-3 py-1 bg-blue-100 text-blue-700 text-sm rounded-full">${e.duration}</span></div><ul class="mt-3 text-sm text-slate-600">${e.details.map(d=>`<li>• ${d}</li>`).join('')}</ul></div>`).join('');
  document.getElementById('educationContainer').innerHTML=contentData.education.map(ed=>`<div class="bg-white p-6 rounded-xl shadow border"><h3 class="font-bold">${ed.degree}</h3><p class="text-blue-600">${ed.school}</p><p class="text-sm text-slate-500">${ed.duration} • ${ed.location}</p></div>`).join('');
}
loadContent();
const _pin="4347";
function openPin(){document.getElementById('pinModal').style.display='flex';}
function closePin(){document.getElementById('pinModal').style.display='none';}
function checkPin(){if(document.getElementById('pinInput').value===_pin){window.location.href='backend/admin.html';}else{document.getElementById('pinError').style.display='block';}}
document.getElementById('adminBtn').addEventListener('click',openPin);
document.getElementById('pinInput').addEventListener('keypress',e=>{if(e.key==='Enter')checkPin();});
document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const data={name:document.getElementById('name').value,email:document.getElementById('email').value,subject:document.getElementById('subject').value,message:document.getElementById('message').value,date:new Date().toISOString()};const subs=JSON.parse(localStorage.getItem('contactSubmissions')||'[]');subs.push(data);localStorage.setItem('contactSubmissions',JSON.stringify(subs));document.getElementById('formMessage').textContent='Saved!';document.getElementById('formMessage').classList.remove('hidden');e.target.reset();});
</script>

<script>
// 6 second loader
document.addEventListener('DOMContentLoaded', ()=>{
  const loader = document.getElementById('pageLoader');
  const bar = document.getElementById('loaderBar');
  let progress = 0;
  const interval = setInterval(()=>{
    progress += 100/60; // 60 steps for 6 seconds (100ms each)
    if(bar) bar.style.width = progress + '%';
    if(progress >= 100){
      clearInterval(interval);
      if(loader){
        loader.style.opacity = '0';
        setTimeout(()=>{loader.style.display='none';}, 800);
      }
    }
  }, 100); // 100ms * 60 = 6000ms = 6 seconds
});
</script>
